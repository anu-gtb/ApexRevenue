apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-dashboard-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-dashboard
  template:
    metadata:
      labels:
        app: sales-dashboard
    spec:
      containers:
      - name: sales-dashboard
        image: sales-dashboard:v3
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 5000
        # --- ADDED: Gives Flask root permission to read/write to the PVC mount ---
        securityContext:
          runAsUser: 0
        # ------------------------------------------------------------------------
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
          - mountPath: /app/data
            name: sqlite-storage
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc